[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Alle übrigen Pfade: Single-Page-App
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
