[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # @sparticuz/chromium-min lädt das eigentliche Chromium-Binary zur Laufzeit
  # von extern nach (siehe netlify/functions/export-cv-pdf.ts) — es muss
  # deshalb NICHT ins Function-Bundle gepackt werden. Ohne diesen Ausschluss
  # versucht esbuild trotzdem, es zu bündeln, was das Bundle-Limit sprengen
  # kann.
   external_node_modules = ["@sparticuz/chromium-min", "puppeteer"]

# ── GEO/SEO: vorgerenderte Seiten (scripts/prerender-seo.mjs) ──────────
# Eine Adresse pro Seite: Schrägstrich am Ende → ohne.
# Die vorgerenderten Seiten (business.html …) liefert Netlify über "Pretty URLs"
# selbst aus. Keine expliziten .html-Rewrites mehr: fehlte eine Datei, gab es 404
# statt der App. Gleiche Regeln zusätzlich in public/_redirects (Bolt-Deploy).
# www vs. ohne www regelt die "Primary domain" in Netlify (Domain management):
# dort decide-your-dream.de (ohne www) als Primary domain einstellen.

[[redirects]]
  from = "/business/"
  to = "/business"
  status = 301
  force = true

[[redirects]]
  from = "/business/automatisierung/"
  to = "/business/automatisierung"
  status = 301
  force = true

