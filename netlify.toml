[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # @sparticuz/chromium-min lädt das eigentliche Chromium-Binary zur Laufzeit
  # von extern nach (siehe netlify/functions/export-cv-pdf.ts) — es muss
  # deshalb NICHT ins Function-Bundle gepackt werden. Ohne diesen Ausschluss
  # versucht esbuild trotzdem, es zu bündeln, was das Bundle-Limit sprengen
  # kann.
   external_node_modules = ["@sparticuz/chromium-min", "puppeteer"]

# ── Weiterleitungen ──────────────────────────────────────────────────
# Bewusst NUR der Single-Page-App-Fallback. Die vorgerenderten Seiten
# (business.html, kurse.html …) findet Netlify über "Pretty URLs" selbst.
# Eigene Regeln wie /business/ -> /business oder /business -> /business.html
# haben mit dem Ordner dist/business/ eine Endlosschleife erzeugt
# (ERR_TOO_MANY_REDIRECTS). Ohne sie kann keine Schleife entstehen.
# Dieselbe Regel steht in public/_redirects (gilt auch beim Deploy aus Bolt).

[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Alle übrigen Pfade: Single-Page-App.
# NIEMALS force = true: Dann würden auch JS/CSS-Dateien durch index.html
# ersetzt und die gesamte Seite wäre leer bzw. nicht erreichbar.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
